name: "MiNiFi-CPP memcheck"
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'
env:
  CMAKE_FLAGS: >-
    -DCMAKE_BUILD_TYPE=Debug
    -DCI_BUILD=ON
    -DDOCKER_BUILD_ONLY=OFF
    -DENABLE_ALL=ON
    -DENABLE_TEST_PROCESSORS=ON
    -DMINIFI_FAIL_ON_WARNINGS=ON
    -DPORTABLE=ON
    -DUSE_SHARED_LIBS=ON
  SCCACHE_GHA_ENABLE: true
  CCACHE_DIR: ${{ GITHUB.WORKSPACE }}/.ccache
jobs:
  address-sanitizer:
    name: "AddressSanitizer+LeakSanitizer on ubuntu 26.04"
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - id: checkout
        uses: actions/checkout@v6
      - name: cache restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ubuntu-26.04-asan-ccache-${{github.ref}}-${{github.sha}}
          restore-keys: |
            ubuntu-26.04-asan-ccache-${{github.ref}}-
            ubuntu-26.04-asan-ccache-refs/heads/main-
      - id: install_deps
        run: |
          sudo apt update
          sudo apt install -y ccache libfl-dev python3 python3-venv
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
          echo -e "127.0.0.1\t$HOSTNAME" | sudo tee -a /etc/hosts > /dev/null
      - name: environment diagnostics
        run: |
          set +e  # never let a diagnostic command abort the job
          uname -a
          gcc --version | head -1
          dpkg -l 'libasan*' 'gcc-1*' | grep '^ii'
          grep -m1 'model name' /proc/cpuinfo; grep -o -m1 la57 /proc/cpuinfo || echo "no la57"
          grep 'address sizes' /proc/cpuinfo | head -1
          echo "mmap_rnd_bits=$(sudo cat /proc/sys/vm/mmap_rnd_bits) overcommit=$(cat /proc/sys/vm/overcommit_memory) max_map_count=$(cat /proc/sys/vm/max_map_count)"
          free -h; echo "nproc=$(nproc)"
          cg=$(awk -F: '/^0::/{print $3}' /proc/self/cgroup)  # cgroup v2 path for this process
          echo "cgroup=$cg"
          for f in memory.max memory.high memory.current; do
            echo "  $f=$(cat "/sys/fs/cgroup${cg}/$f" 2>/dev/null)"
          done
          true
      - name: build
        run: |
          python3 -m venv venv && source venv/bin/activate \
            && pip install -r requirements.txt \
            && python main.py --noninteractive --minifi-options="${CMAKE_FLAGS} -DMINIFI_ADVANCED_ASAN_BUILD=ON" --cmake-options="-DSTRICT_GSL_CHECKS=AUDIT"
        working-directory: bootstrap
      - name: cache save
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ubuntu-26.04-asan-ccache-${{github.ref}}-${{github.sha}}
      - name: test
        id: test
        run: |
          # Set core file size limit to unlimited
          ulimit -c unlimited
          ctest -j$(nproc) --output-on-failure
        working-directory: build
      - name: capture ASan shadow layout and fault map
        if: always()
        run: |
          set +e  # diagnostics must never fail the job
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb
          # Run a known-crashing C2 integration test DIRECTLY (not via ctest), so our ASAN_OPTIONS
          # win: the CMake ENVIRONMENT property only overrides ASAN_OPTIONS when run through ctest.
          # These binaries take no args and are self-contained (Catch2WithMain + TEST_RESOURCES).
          TEST=./bin/C2DescribeCoreComponentStateTest

          # detect_odr_violation=1 (report only on size mismatch) is what CMake's ENVIRONMENT normally
          # supplies via ctest; without it ASan aborts at startup on the many duplicate globals from
          # USE_SHARED_LIBS=ON, before the real civetweb/SSL crash can occur.
          echo "===================== [1] ASan address-space layout (verbosity=2) ====================="
          ASAN_OPTIONS=verbosity=2:print_legend=1:detect_odr_violation=1 timeout 150 "$TEST" > asan_init.log 2>&1
          grep -iE "SHADOW_OFFSET|HighMem|LowMem|MidMem|Shadow|redzone|kHigh|Reserve|Mmap" asan_init.log | head -60
          echo "--- init log tail ---"; tail -25 asan_init.log

          echo "===================== [2] gdb: run until SEGV, dump real mmap + backtraces ====================="
          # gdb intercepts SIGSEGV before ASan's handler, so we see the faulting state and full map.
          export ASAN_OPTIONS=detect_odr_violation=1  # inherited by the gdb inferior
          for i in $(seq 1 25); do
            timeout 180 gdb -q -batch -nx \
              -ex 'run' \
              -ex 'printf "\n===== FAULT DETAILS =====\n"' \
              -ex 'print/x $_siginfo._sifields._sigfault.si_addr' \
              -ex 'info registers rip' \
              -ex 'bt' \
              -ex 'thread apply all bt' \
              -ex 'info proc mappings' \
              --args "$TEST" > "gdb_$i.log" 2>&1
            if grep -q "SIGSEGV" "gdb_$i.log"; then
              echo ">>> Reproduced SEGV on iteration $i"
              cat "gdb_$i.log"
              break
            fi
            echo "iteration $i: no SEGV (exited normally)"
          done
        working-directory: build
      - name: upload ASan/LSan output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asan-logs
          path: |
            build/asan_logs/*
            build/asan_init.log
            build/gdb_*.log
          if-no-files-found: ignore
